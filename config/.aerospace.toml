config-version = 2

start-at-login = true
default-root-container-layout = 'tiles'
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false
accordion-padding = 0

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8"]

# Gaps settings
gaps.inner.horizontal = 15
gaps.inner.vertical = 15
gaps.outer.left = 15
gaps.outer.bottom = 15
gaps.outer.top = 5
gaps.outer.right = 15

on-window-detected = [
    # Workspace 1 - Personal Chat (tiled, freely resizable)
    { if = 'test %{app-bundle-id} = net.whatsapp.WhatsApp || test %{app-bundle-id} = com.tinyapp.WhatsApp', run = 'move-node-to-workspace 1' },
    { if = 'test %{app-bundle-id} = ru.keepcoder.Telegram', run = 'move-node-to-workspace 1' },

    # Workspace 2 - Browser & Obsidian
    { if = 'test %{app-bundle-id} = com.vivaldi.Vivaldi', run = 'move-node-to-workspace 2' },
    { if = 'test %{app-bundle-id} = md.obsidian', run = 'move-node-to-workspace 2' },

    # Workspace 3 - VSCode (accordion stack, same size as iTerm2, cycle with cmd+~)
    { if = 'test %{app-bundle-id} = com.microsoft.VSCode', run = ['move-node-to-workspace 3', 'layout h_accordion'] },

    # Workspace 4 - Terminal (fullscreen)
    { if = 'test %{app-bundle-id} = com.googlecode.iterm2', run = ['move-node-to-workspace 4', 'fullscreen'] },

    # Workspace 5 - Slack (fullscreen)
    { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = ['move-node-to-workspace 5', 'fullscreen'] },

    # Workspace 6 - Productivity
    { if = 'test %{app-bundle-id} = com.cron.electron', run = 'move-node-to-workspace 6' },
    { if = 'test %{app-bundle-id} = notion.id', run = 'move-node-to-workspace 6' },
    { if = 'test %{app-bundle-id} = notion.mail.id', run = 'move-node-to-workspace 6' },

    # Workspace 7 - Database (floating)
    { if = 'test %{app-bundle-id} = org.jkiss.dbeaver.core.product', run = ['move-node-to-workspace 7', 'layout floating'] },
    { if = 'test %{app-bundle-id} = org.pgadmin.pgadmin4', run = ['move-node-to-workspace 7', 'layout floating'] },
    { if = 'test %{app-bundle-id} = com.elasticvue.app', run = ['move-node-to-workspace 7', 'layout floating'] },

    # Workspace 8 - Music
    { if = 'test %{app-bundle-id} = com.spotify.client', run = 'move-node-to-workspace 8' },
]

# Utility key binding
[mode.main.binding]
shift-alt-f = 'fullscreen'
shift-alt-r = 'reload-config'
shift-alt-space = 'layout floating tiling'
shift-alt-e = 'balance-sizes'

# Navigation settings and keymap
cmd-alt-left = 'focus left'
cmd-alt-right = 'focus right'

shift-alt-left = 'resize smart -50'
shift-alt-right = 'resize smart +50'
shift-alt-up = 'resize smart -50'
shift-alt-down = 'resize smart +50'

ctrl-alt-left = 'move left'
ctrl-alt-right = 'move right'
ctrl-alt-up = 'move up'
ctrl-alt-down = 'move down'

# Workspace settings & Navigation
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
